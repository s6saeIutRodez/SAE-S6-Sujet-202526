version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hotel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hotel_db
    ports:
      - "3406:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - hotel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hotel-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    networks:
      - hotel-network

  grafana-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: hotel-grafana
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC (traces)
      - "4318:4318"   # OTLP HTTP (métriques)
    volumes:
      # Provisioning auto : datasources + dashboards chargés au démarrage
      - ./grafana/provisioning:/otel-lgtm/grafana/provisioning
        - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - hotel-network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  hotel-network:
    driver: bridge