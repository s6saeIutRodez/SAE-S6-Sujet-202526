# ===================================================================
# CONFIGURATION GÉNÉRALE & SERVEUR
# ===================================================================
spring.application.name=hotel-api
server.port=8060

# ===================================================================
# BASE DE DONNÉES (MySQL Docker)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3406/hotel_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Data SQL
spring.sql.init.mode=always

# ===================================================================
# CONFIGURATION DES EMAILS (Redirection locale vers Mailhog)
# ===================================================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ===================================================================
# OBSERVABILITÉ NATIVE (Spring Boot Actuator & Micrometer OTLP)
# ===================================================================
# Activation et exposition des endpoints Actuator essentiels
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

# --- CONFIGURATION DES TRACES (Micrometer Tracing) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# --- CONFIGURATION DES MÉTRIQUES (Micrometer OTLP Registry) ---
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=10s
management.otlp.metrics.export.resource-attributes.service.name=hotel-api

# --- FORMATAGE DES LOGS ---
# Inclusion automatique du Trace ID et Span ID dans la console
logging.pattern.level=%5p [${spring.application.name:-},%X{trace_id:-},%X{span_id:-}]