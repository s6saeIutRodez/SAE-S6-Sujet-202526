# ===================================================================
# CONFIGURATION GÉNÉRALE & SERVEUR
# ===================================================================
spring.application.name=hotel-api
server.port=8060

# ===================================================================
# BASE DE DONNÉES (MySQL Docker)
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3406/hotel_db
spring.datasource.username=root
spring.datasource.password=root

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# Liquibase
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Data SQL
spring.sql.init.mode=always

# ===================================================================
# CONFIGURATION DES EMAILS (Redirection locale vers Mailhog)
# ===================================================================
spring.mail.host=localhost
spring.mail.port=1025
# Pas besoin d'identifiants ni de TLS pour Mailhog en local :
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Note : Si tu as besoin de rebasculer sur ton Gmail d'IUT pour le rendu final,
