databaseChangeLog:
  - changeSet:
      id: 001
      author: ton-nom
      changes:
        - createTable:
            tableName: room_type
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: total_rooms
                  type: INT
                  constraints:
                    nullable: false